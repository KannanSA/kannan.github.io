[build]
  command = "npm run build"
  publish = "out"

# Canonical host. Netlify's managed HTTPS upgrade can still turn
# http://sakannan.com into https://sakannan.com before these rules run.
# When they do run on the original request, the apex reaches www in one hop.
[[redirects]]
  from = "http://sakannan.com/*"
  to = "https://www.sakannan.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://sakannan.com/*"
  to = "https://www.sakannan.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sakannan.com/*"
  to = "https://www.sakannan.com/:splat"
  status = 301
  force = true

# Static export writes the homepage to index.html. Serve one URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/KSCV7R.pdf"
  to = "/kannan-sekar-cv.pdf"
  status = 301
  force = true
